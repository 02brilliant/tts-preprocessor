<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS Preprocessor Test</title>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: #fffaf2;
      --line: #d4c5ae;
      --text: #2b241b;
      --accent: #8c4f2b;
      --accent-strong: #6f3d1f;
      --error-bg: #fff1ef;
      --error-text: #a12622;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(circle at top, rgba(140, 79, 43, 0.10), transparent 30%),
        linear-gradient(180deg, #f8f3eb 0%, var(--bg) 100%);
      color: var(--text);
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(61, 43, 24, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 18px;
      color: rgba(43, 36, 27, 0.78);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fffdf9;
      color: var(--text);
      font: inherit;
      line-height: 1.6;
      resize: vertical;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      padding: 12px 20px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .status {
      min-height: 24px;
      font-size: 14px;
    }

    .status.loading {
      color: var(--accent-strong);
    }

    .status.error {
      color: var(--error-text);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-top: 24px;
    }

    .result-box {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #fffdf8;
    }

    .result-box h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .plain-output,
    .diff-output {
      min-height: 84px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
    }

    .diff-output {
      font-size: 16px;
    }

    /* ──────────────────────────────────────────────────────────
       Diff 스타일 규칙
       ────────────────────────────────────────────────────────── */

    /* 삭제: 분홍색 배경 + 빨간 텍스트 + 취소선 */
    .diff-del {
      background: #ffe0e0;
      color: #cc0000;
      text-decoration: line-through;
      padding: 1px 3px;
      border-radius: 4px;
    }

    /* 추가: 연한 초록 배경 + 진한 초록 텍스트 + 굵은 글씨 */
    .diff-add {
      background: #e6ffed;
      color: #1a7f37;
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 4px;
    }

    /* 자동 추가 쉼표: 연한 초록 + 진한 초록 + 점선 테두리 */
    .diff-add-comma {
      background: #e6ffed;
      color: #1a7f37;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px dashed #1a7f37;
    }

    /* 자동 문단 구분: 회색 캡슐 태그 */
    .diff-paragraph {
      display: inline-block;
      background: #f0f0f0;
      color: #666666;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      vertical-align: middle;
      margin: 0 2px;
    }

    /* 공백 시각화: 삭제/추가 영역 내 공백 심볼 */
    .diff-space-sym {
      opacity: 0.75;
    }

    /* ────────────────────────────────────────────────────────── */

    .error-box {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #f3c4be;
      white-space: pre-wrap;
    }

    .downloads {
      margin-top: 24px;
    }

    .downloads-list {
      display: grid;
      gap: 12px;
    }

    .download-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffdf8;
      flex-wrap: wrap;
    }

    .download-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .download-version {
      font-weight: 700;
    }

    .download-date {
      font-size: 14px;
      color: rgba(43, 36, 27, 0.7);
    }

    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 124px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 12px 18px;
      font-weight: 700;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .download-link:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
    }

    .download-empty {
      color: rgba(43, 36, 27, 0.72);
    }

    @media (max-width: 640px) {
      .page {
        padding: 20px 14px 36px;
      }

      .panel {
        padding: 18px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>TTS 전처리 테스트</h1>
      <p>입력 문장을 전송하면 API 응답과 함께 입력 대비 변경 diff를 바로 보여줍니다.</p>

      <label for="input">입력 텍스트</label>
      <textarea id="input" placeholder="예: AI는 2025-01-03에 3kg 제품을 69% 할인한다">AI는 2025-01-03에 3kg 제품을 69% 할인한다</textarea>

      <div class="actions">
        <button id="run-button" type="button">실행</button>
        <div id="status" class="status" aria-live="polite"></div>
      </div>

      <div id="error" class="error-box" role="alert"></div>

      <div class="result-grid">
        <section class="result-box">
          <h2>정규화 결과</h2>
          <div id="output" class="plain-output"></div>
        </section>

        <section class="result-box">
          <h2>Diff</h2>
          <div id="diff" class="diff-output"></div>
        </section>
      </div>

      <section class="downloads result-box">
        <h2>다운로드 가능한 실행모듈</h2>
        <div id="downloads-status" class="status" aria-live="polite"></div>
        <div id="downloads-list" class="downloads-list"></div>
      </section>
    </section>
  </main>

  <script>
    const inputEl = document.getElementById("input");
    const outputEl = document.getElementById("output");
    const diffEl = document.getElementById("diff");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const runButton = document.getElementById("run-button");
    const downloadsStatusEl = document.getElementById("downloads-status");
    const downloadsListEl = document.getElementById("downloads-list");

    // ── HTML escape ─────────────────────────────────────────────────────────
    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    // ── Token-level diff ────────────────────────────────────────────────────
    //
    // TTS 정규화는 단어 단위로 변환 (예: "2025-01-03" → "이천이십오년 일월 삼일")하므로
    // 문자 단위 diff는 공통점이 없어 전체가 삭제+추가로 표시됩니다.
    // 해결: 먼저 문자열을 "단어 토큰"으로 쪼갠 뒤, 토큰 단위로 LCS를 수행합니다.
    //
    // DiffType:
    //   "unchanged"          – 변경 없음 (일반 텍스트)
    //   "deleted"            – 삭제됨
    //   "inserted"           – 추가됨
    //   "inserted_comma"     – 쉼표(,/，)만 삽입된 경우
    //   "paragraph_tag"      – 입력에 없던 줄바꿈 묶음의 첫 개행 (자동 문단 구분)
    //   "inserted_newline"   – 태그 없이 유지할 삽입 개행
    //   "whitespace_changed" – 공백 변화

    // 문자열을 토큰 배열로 분리.
    // 토큰 종류:
    //   - 줄바꿈 / 공백
    //   - 숫자 블록(소수점, 날짜형 하이픈, 분수/비율 구분자 포함)
    //   - 영문 블록
    //   - 한글 블록
    //   - 단위/통화 기호
    //   - 그 밖의 단일 문자
    //
    // 핵심은 "12권과", "2025년", "WHO와", "25℃" 같은 혼합 토큰을
    // ["12", "권과"], ["2025", "년"], ["WHO", "와"], ["25", "℃"]처럼 쪼개서
    // 공통 접미사/조사가 LCS에서 안정적으로 매칭되게 하는 것이다.
    const TOKEN_REGEX = /\n|[^\S\n]+|[-+]?\d[\d,]*(?:[.:·/~-]\d[\d,]*)*|[A-Za-z]+(?:[&.][A-Za-z]+)*|[가-힣]+|[㎡㎥℃℉º°%]+|[₩￥￦€$¥]|[^\s]/gu;

    function tokenize(text) {
      return text.match(TOKEN_REGEX) || [];
    }

    // 토큰 배열 a, b 에 대한 LCS DP 테이블 구축.
    function buildTokenLCS(a, b) {
      const m = a.length;
      const n = b.length;
      const dp = new Uint32Array((m + 1) * (n + 1));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (a[i - 1] === b[j - 1]) {
            dp[i * (n + 1) + j] = dp[(i - 1) * (n + 1) + (j - 1)] + 1;
          } else {
            const top = dp[(i - 1) * (n + 1) + j];
            const left = dp[i * (n + 1) + (j - 1)];
            dp[i * (n + 1) + j] = top > left ? top : left;
          }
        }
      }
      return { dp, n };
    }

    // LCS backtrack → 토큰별 op 배열 생성.
    function traceTokenOps(dp, a, b, n) {
      const ops = [];
      let i = a.length;
      let j = b.length;
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
          ops.push({ token: a[i - 1], op: "eq" });
          i--; j--;
        } else if (j > 0 && (i === 0 || dp[i * (n + 1) + j] === dp[i * (n + 1) + (j - 1)])) {
          ops.push({ token: b[j - 1], op: "ins" });
          j--;
        } else {
          ops.push({ token: a[i - 1], op: "del" });
          i--;
        }
      }
      ops.reverse();
      return ops;
    }

    // 토큰 op를 DiffType 파트로 변환.
    function classifyTokenOp(op) {
      const { token, op: kind } = op;
      if (kind === "eq") {
        return { value: token, type: "unchanged" };
      }
      if (kind === "del") {
        return { value: token, type: "deleted" };
      }
      // ins
      if (token === "\n") {
        return { value: token, type: "_ins_newline" };
      }
      if (/^[,，]+$/.test(token)) {
        return { value: token, type: "inserted_comma" };
      }
      if (/^\s+$/.test(token)) {
        return { value: token, type: "_ins_space" };
      }
      return { value: token, type: "inserted" };
    }

    // 삽입된 공백 토큰 분류:
    //   - 인접한 삭제 공백이 있으면 → "whitespace_changed" (공백 변화, ␣ 표시)
    //   - 없으면 → "unchanged" (일반 텍스트 출력, 불필요한 강조·패딩 방지)
    // 표시 규칙 §3: "unchanged 및 inserted 내 일반 공백은 그대로 출력"
    function refineWhitespace(parts) {
      return parts.map((part, idx) => {
        if (part.type !== "_ins_space") return part;
        const prev = parts[idx - 1];
        const next = parts[idx + 1];
        const adjDel = (p) => p && p.type === "deleted" && /^\s+$/.test(p.value);
        if (adjDel(prev) || adjDel(next)) {
          return { value: part.value, type: "whitespace_changed" };
        }
        // 새 단어 사이의 자연스러운 공백 — 강조 없이 그대로 출력
        return { value: part.value, type: "unchanged" };
      });
    }

    // 삽입된 줄바꿈 토큰 분류:
    //   - 입력 줄바꿈 옆에 붙은 삽입 개행 묶음: 태그 없이 개행만 유지
    //   - 입력에 없던 새 개행 묶음: 첫 개행만 "paragraph_tag", 나머지는 개행만 유지
    function refineNewlines(parts) {
      const refined = [];
      const isSourceNewline = (part) =>
        part && (part.type === "unchanged" || part.type === "deleted") && part.value === "\n";

      for (let idx = 0; idx < parts.length; idx++) {
        const part = parts[idx];
        if (part.type !== "_ins_newline") {
          refined.push(part);
          continue;
        }

        let end = idx;
        while (end + 1 < parts.length && parts[end + 1].type === "_ins_newline") {
          end += 1;
        }

        const prev = refined[refined.length - 1];
        const next = parts[end + 1];
        const touchesSourceNewline = isSourceNewline(prev) || isSourceNewline(next);

        for (let runIdx = idx; runIdx <= end; runIdx++) {
          refined.push({
            value: "\n",
            type: !touchesSourceNewline && runIdx === idx ? "paragraph_tag" : "inserted_newline",
          });
        }

        idx = end;
      }

      return refined;
    }

    // 메인 diff 함수: 토큰 단위 LCS → DiffType 파트 배열.
    function diffTokens(source, target) {
      if (source === target) {
        return [{ value: source, type: "unchanged" }];
      }
      const srcTokens = tokenize(source);
      const tgtTokens = tokenize(target);
      const { dp, n } = buildTokenLCS(srcTokens, tgtTokens);
      const ops = traceTokenOps(dp, srcTokens, tgtTokens, n);
      const parts = ops.map(classifyTokenOp);
      return refineNewlines(refineWhitespace(parts));
    }

    // ── Rendering ────────────────────────────────────────────────────────────

    const SPACE_SYM = "\u2423"; // ␣  OPEN BOX — 삭제된 공백 시각화용

    function visualizeSpaces(text) {
      return text.replace(/ /g, `<span class="diff-space-sym">${SPACE_SYM}</span>`);
    }

    function renderParts(parts) {
      return parts.map((part) => {
        const { value, type } = part;

        switch (type) {
          case "unchanged":
            return escapeHtml(value);

          case "deleted":
            return `<span class="diff-del">${visualizeSpaces(escapeHtml(value))}</span>`;

          case "inserted":
            return `<span class="diff-add">${escapeHtml(value)}</span>`;

          case "inserted_comma":
            return `<span class="diff-add-comma">${escapeHtml(value)}</span>`;

          case "paragraph_tag":
            return `<span class="diff-paragraph">&lt;문단 자동 구분&gt;</span>\n`;

          case "inserted_newline":
            return "\n";

          case "whitespace_changed":
            return `<span class="diff-add">${visualizeSpaces(escapeHtml(value))}</span>`;

          default:
            return escapeHtml(value);
        }
      }).join("");
    }

    function renderDiff(source, target) {
      const parts = diffTokens(source, target);
      diffEl.innerHTML = renderParts(parts);
    }

    // ── UI helpers ───────────────────────────────────────────────────────────

    function setLoading(isLoading) {
      runButton.disabled = isLoading;
      statusEl.textContent = isLoading ? "변환 중..." : "";
      statusEl.className = isLoading ? "status loading" : "status";
    }

    function showError(message) {
      errorEl.style.display = "block";
      errorEl.textContent = message;
      statusEl.textContent = "오류가 발생했습니다.";
      statusEl.className = "status error";
    }

    function clearError() {
      errorEl.style.display = "none";
      errorEl.textContent = "";
    }

    const DOWNLOAD_TARGETS = [
      { name: "Linux 실행모듈 다운로드", file: "tts-preprocessor.zip" },
      { name: "Windows 실행모듈 다운로드", file: "tts-preprocessor-windows.zip" },
      { name: "macOS 실행모듈 다운로드", file: "tts-preprocessor-macos.zip" },
    ];

    async function checkDownloadAvailable(file) {
      try {
        const response = await fetch(
          `${getBackendBase()}/downloads/${encodeURIComponent(file)}`,
          { method: "HEAD" }
        );
        return response.ok;
      } catch {
        return false;
      }
    }

    function renderDownloads(items) {
      if (!Array.isArray(items) || items.length === 0) {
        downloadsListEl.innerHTML = '<div class="download-empty">다운로드 가능한 패키지가 없습니다.</div>';
        return;
      }

      downloadsListEl.innerHTML = items.map((item) => {
        const name = escapeHtml(typeof item.name === "string" ? item.name : "실행모듈");
        const file = escapeHtml(typeof item.file === "string" ? item.file : "");
        const available = item.available === true;

        if (available) {
          const downloadHref = `${getBackendBase()}/downloads/${encodeURIComponent(item.file)}`;
          return `
            <div class="download-item">
              <div class="download-meta">
                <div class="download-version">${name}</div>
                <div class="download-date">${file}</div>
              </div>
              <a class="download-link" href="${downloadHref}" download>다운로드</a>
            </div>
          `;
        }

        return `
          <div class="download-item">
            <div class="download-meta">
              <div class="download-version">${name}</div>
              <div class="download-date">${file} · 준비 중</div>
            </div>
            <span class="download-empty">준비 중</span>
          </div>
        `;
      }).join("");
    }

    async function loadDownloads() {
      downloadsStatusEl.textContent = "다운로드 패키지를 확인하는 중...";
      downloadsStatusEl.className = "status";

      const items = await Promise.all(
        DOWNLOAD_TARGETS.map(async (target) => ({
          ...target,
          available: await checkDownloadAvailable(target.file),
        }))
      );

      renderDownloads(items);

      const availableCount = items.filter((item) => item.available).length;
      if (availableCount === 0) {
        downloadsStatusEl.textContent = "현재 다운로드 가능한 실행모듈이 없습니다.";
      } else if (availableCount < items.length) {
        downloadsStatusEl.textContent = `${availableCount}개 다운로드 가능 (${items.length - availableCount}개 준비 중)`;
      } else {
        downloadsStatusEl.textContent = "";
      }
      downloadsStatusEl.className = "status";
    }

    function getBackendBase() {
      return window.location.origin;
    }

    async function run() {
      const text = inputEl.value;

      clearError();
      setLoading(true);

      try {
        const API_BASE = getBackendBase();

        const response = await fetch(`${API_BASE}/api/transform`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = typeof data.detail === "string" ? data.detail : "API 요청에 실패했습니다.";
          throw new Error(detail);
        }

        const normalizedText = typeof data.normalized_text === "string" ? data.normalized_text : "";
        outputEl.textContent = normalizedText;
        renderDiff(text, normalizedText);
        statusEl.textContent = "완료";
        statusEl.className = "status";
      } catch (error) {
        outputEl.textContent = "";
        diffEl.textContent = "";
        showError(error instanceof Error ? error.message : "알 수 없는 오류가 발생했습니다.");
      } finally {
        runButton.disabled = false;
        if (!statusEl.classList.contains("error")) {
          setLoading(false);
        }
      }
    }

    runButton.addEventListener("click", run);
    loadDownloads();
  </script>
</body>
</html>
