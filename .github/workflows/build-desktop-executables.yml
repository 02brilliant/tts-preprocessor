name: Build Windows executable

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"

      - name: Verify Python runtime
        shell: pwsh
        run: |
          python -c "import sys, sysconfig; assert sys.version_info[:2] == (3, 13); assert not sysconfig.get_config_var('Py_GIL_DISABLED')"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements/build.txt

      - name: Verify official PyInstaller specs
        shell: pwsh
        run: |
          $stage1Spec = Get-Content -LiteralPath "tts_preprocessor.spec" -Raw
          $simplifiedSpec = Get-Content -LiteralPath "tts_preprocessor_simplified.spec" -Raw
          $minimalSpec = Get-Content -LiteralPath "tts_preprocessor_llm_minimal.spec" -Raw
          $naturalSpec = Get-Content -LiteralPath "tts_preprocessor_llm_natural.spec" -Raw
          $pronunciationSpec = Get-Content -LiteralPath "tts_preprocessor_llm_pronunciation.spec" -Raw
          if ($stage1Spec -notmatch 'bin.+build_binary_entrypoint\.py') {
            throw "Official binary entrypoint is missing from tts_preprocessor.spec"
          }
          if ($minimalSpec -notmatch 'bin.+build_llm_minimal_entrypoint\.py') {
            throw "Level 3 entrypoint is missing"
          }
          if ($naturalSpec -notmatch 'bin.+build_llm_natural_entrypoint\.py') {
            throw "Level 4 entrypoint is missing"
          }
          if ($pronunciationSpec -notmatch 'bin.+build_llm_pronunciation_entrypoint\.py') {
            throw "Level 5 entrypoint is missing"
          }
          if ($simplifiedSpec -notmatch 'bin.+build_simplified_binary_entrypoint\.py') {
            throw "Simplified entrypoint is missing from tts_preprocessor_simplified.spec"
          }

      - name: Build executable
        shell: pwsh
        run: |
          $env:TTS_PREPROCESSOR_EXECUTABLE_NAME = "tts-preprocessor"
          python -m PyInstaller `
            --clean `
            --noconfirm `
            "$env:GITHUB_WORKSPACE\tts_preprocessor.spec"
          if (-not (Test-Path -LiteralPath "dist\tts-preprocessor.exe" -PathType Leaf)) {
            throw "Built executable not found: dist\tts-preprocessor.exe"
          }
          $env:TTS_PREPROCESSOR_SIMPLIFIED_EXECUTABLE_NAME = "tts-preprocessor-simplified"
          python -m PyInstaller `
            --clean `
            --noconfirm `
            "$env:GITHUB_WORKSPACE\tts_preprocessor_simplified.spec"
          if (-not (Test-Path -LiteralPath "dist\tts-preprocessor-simplified.exe" -PathType Leaf)) {
            throw "Built simplified executable not found: dist\tts-preprocessor-simplified.exe"
          }
          $env:TTS_PREPROCESSOR_LLM_MINIMAL_EXECUTABLE_NAME = "tts-preprocessor-llm-minimal"
          python -m PyInstaller `
            --clean `
            --noconfirm `
            "$env:GITHUB_WORKSPACE\tts_preprocessor_llm_minimal.spec"
          if (-not (Test-Path -LiteralPath "dist\tts-preprocessor-llm-minimal.exe" -PathType Leaf)) {
            throw "Built level 3 executable not found"
          }
          $env:TTS_PREPROCESSOR_LLM_NATURAL_EXECUTABLE_NAME = "tts-preprocessor-llm-natural"
          python -m PyInstaller `
            --clean `
            --noconfirm `
            "$env:GITHUB_WORKSPACE\tts_preprocessor_llm_natural.spec"
          if (-not (Test-Path -LiteralPath "dist\tts-preprocessor-llm-natural.exe" -PathType Leaf)) {
            throw "Built level 4 executable not found"
          }
          $env:TTS_PREPROCESSOR_LLM_PRONUNCIATION_EXECUTABLE_NAME = "tts-preprocessor-llm-pronunciation"
          python -m PyInstaller `
            --clean `
            --noconfirm `
            "$env:GITHUB_WORKSPACE\tts_preprocessor_llm_pronunciation.spec"
          if (-not (Test-Path -LiteralPath "dist\tts-preprocessor-llm-pronunciation.exe" -PathType Leaf)) {
            throw "Built level 5 executable not found"
          }

      - name: Smoke test executable
        shell: pwsh
        run: |
          $smokeText = "2천8백28억, 2천8백28억테스트"
          $expected = "이천팔백이십팔억, 이천팔백이십팔억 테스트"
          $actual = (& ".\dist\tts-preprocessor.exe" --text $smokeText | Out-String).TrimEnd()
          if ($LASTEXITCODE -ne 0) {
            throw "Windows executable smoke test exited with $LASTEXITCODE"
          }
          if ($actual -ne $expected) {
            throw "Windows executable smoke mismatch. Expected '$expected', got '$actual'"
          }
          & ".\dist\tts-preprocessor-llm-minimal.exe" --check | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows level 3 executable asset check failed"
          }
          & ".\dist\tts-preprocessor-llm-natural.exe" --check | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows level 4 executable asset check failed"
          }
          & ".\dist\tts-preprocessor-llm-pronunciation.exe" --check | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Windows level 5 executable asset check failed"
          }
          $simplifiedActual = (& ".\dist\tts-preprocessor-simplified.exe" --text "ABC와 3kg" | Out-String).TrimEnd()
          if ($LASTEXITCODE -ne 0 -or $simplifiedActual -ne "ABC와 삼 킬로그램") {
            throw "Windows simplified executable smoke test failed."
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $readme = "docs\Release_Package_README.txt"
          if (-not (Test-Path -LiteralPath $readme -PathType Leaf)) {
            throw "README template not found: $readme"
          }

          New-Item -ItemType Directory -Force -Path package, artifact | Out-Null
          Copy-Item -LiteralPath "dist\tts-preprocessor.exe" -Destination "package\tts-preprocessor.exe"
          Copy-Item -LiteralPath "dist\tts-preprocessor-simplified.exe" -Destination "package\tts-preprocessor-simplified.exe"
          Copy-Item -LiteralPath "dist\tts-preprocessor-llm-minimal.exe" -Destination "package\tts-preprocessor-llm-minimal.exe"
          Copy-Item -LiteralPath "dist\tts-preprocessor-llm-natural.exe" -Destination "package\tts-preprocessor-llm-natural.exe"
          Copy-Item -LiteralPath "dist\tts-preprocessor-llm-pronunciation.exe" -Destination "package\tts-preprocessor-llm-pronunciation.exe"
          Copy-Item -LiteralPath $readme -Destination "package\README.txt"

          $zip = "artifact\tts-preprocessor-windows.zip"
          Compress-Archive -Path "package\*" -DestinationPath $zip -Force

      - name: Verify Windows ZIP
        shell: pwsh
        run: |
          $zip = "artifact\tts-preprocessor-windows.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Windows ZIP not found: $zip"
          }

          Expand-Archive -Path $zip -DestinationPath verify-windows -Force
          $actual = @(
            Get-ChildItem -LiteralPath verify-windows -Recurse -File |
              ForEach-Object {
                $_.FullName.Substring((Resolve-Path verify-windows).Path.Length + 1).Replace("\", "/")
              } |
              Sort-Object
          )
          $expected = @("README.txt", "tts-preprocessor-llm-minimal.exe", "tts-preprocessor-llm-natural.exe", "tts-preprocessor-llm-pronunciation.exe", "tts-preprocessor-simplified.exe", "tts-preprocessor.exe")
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Host
            throw "Unexpected Windows ZIP contents: $($actual -join ', ')"
          }

          $forbidden = $actual | Where-Object {
            $_ -match '(^|/)(engine|tests|docs|\.venv|__pycache__)(/|$)' -or
            $_ -match '\.py(c)?$'
          }
          if ($forbidden) {
            throw "Source or development files found in Windows ZIP: $($forbidden -join ', ')"
          }

          $smokeText = "2천8백28억, 2천8백28억테스트"
          $expectedSmoke = "이천팔백이십팔억, 이천팔백이십팔억 테스트"
          $actualSmoke = (& ".\verify-windows\tts-preprocessor.exe" --text $smokeText | Out-String).TrimEnd()
          if ($LASTEXITCODE -ne 0 -or $actualSmoke -ne $expectedSmoke) {
            throw "Extracted Windows executable smoke test failed."
          }
          & ".\verify-windows\tts-preprocessor-llm-minimal.exe" --check | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Windows level 3 executable asset check failed."
          }
          & ".\verify-windows\tts-preprocessor-llm-natural.exe" --check | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Windows level 4 executable asset check failed."
          }
          & ".\verify-windows\tts-preprocessor-llm-pronunciation.exe" --check | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Windows level 5 executable asset check failed."
          }
          $simplifiedSmoke = (& ".\verify-windows\tts-preprocessor-simplified.exe" --text "ABC와 3kg" | Out-String).TrimEnd()
          if ($LASTEXITCODE -ne 0 -or $simplifiedSmoke -ne "ABC와 삼 킬로그램") {
            throw "Extracted Windows simplified executable smoke test failed."
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tts-preprocessor-windows
          path: artifact/tts-preprocessor-windows.zip
          if-no-files-found: error
