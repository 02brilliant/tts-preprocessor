name: Build desktop executables

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            artifact_name: tts-preprocessor-windows
            executable_name: tts-preprocessor.exe
            archive_name: tts-preprocessor-windows.zip
            add_data_sep: ";"
          - target: macos
            os: macos-latest
            artifact_name: tts-preprocessor-macos
            executable_name: tts-preprocessor
            archive_name: tts-preprocessor-macos.zip
            add_data_sep: ":"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # No root requirements.txt; engine runtime is stdlib-only.
          pip install pyinstaller

      - name: Create StrEnum runtime hook (Python 3.10)
        shell: bash
        run: |
          mkdir -p pyinstaller_runtime_hooks
          cat > pyinstaller_runtime_hooks/enum_strenum_compat.py <<'PY'
          import enum

          if not hasattr(enum, "StrEnum"):
              class StrEnum(str, enum.Enum):
                  def __str__(self):
                      return self.value

                  @staticmethod
                  def _generate_next_value_(name, start, count, last_values):
                      return name.lower()

              enum.StrEnum = StrEnum
          PY

      - name: Build executable
        shell: bash
        run: |
          set -euo pipefail
          ROOT_DIR="$GITHUB_WORKSPACE"
          pyinstaller \
            --clean \
            --onefile \
            --name tts-preprocessor \
            --paths "$ROOT_DIR" \
            --collect-submodules engine \
            --add-data "$ROOT_DIR/engine/data${{ matrix.add_data_sep }}engine/data" \
            --runtime-hook "$ROOT_DIR/pyinstaller_runtime_hooks/enum_strenum_compat.py" \
            "$ROOT_DIR/bin/build_binary_entrypoint.py"
          test -f "dist/${{ matrix.executable_name }}"

      - name: Prepare artifact (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $readme = "docs\Release_Package_README.txt"
          if (-not (Test-Path -LiteralPath $readme)) {
            throw "README template not found: $readme"
          }
          New-Item -ItemType Directory -Force -Path package, artifact | Out-Null
          Copy-Item -LiteralPath "dist\tts-preprocessor.exe" -Destination "package\tts-preprocessor.exe"
          Copy-Item -LiteralPath $readme -Destination "package\README.txt"
          $zip = "artifact\tts-preprocessor-windows.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path "package\*" -DestinationPath $zip -Force

      - name: Verify artifact (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $zip = "artifact\tts-preprocessor-windows.zip"
          Expand-Archive -Path $zip -DestinationPath verify-windows -Force
          if (-not (Test-Path -LiteralPath "verify-windows\README.txt")) {
            throw "README.txt missing in $zip"
          }
          if (-not (Test-Path -LiteralPath "verify-windows\tts-preprocessor.exe")) {
            throw "tts-preprocessor.exe missing in $zip"
          }
          Write-Host "Contents of $zip :"
          Get-ChildItem verify-windows | Format-Table Name, Length

      - name: Prepare artifact (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test -f "docs/Release_Package_README.txt"
          mkdir -p package artifact
          cp "dist/tts-preprocessor" "package/tts-preprocessor"
          cp "docs/Release_Package_README.txt" "package/README.txt"
          chmod +x "package/tts-preprocessor"
          rm -f "artifact/tts-preprocessor-macos.zip"
          (cd package && zip -r "../artifact/tts-preprocessor-macos.zip" .)
          echo "Contents of artifact/tts-preprocessor-macos.zip:"
          unzip -l "artifact/tts-preprocessor-macos.zip"

      - name: Verify artifact (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-macos
          unzip -q "artifact/tts-preprocessor-macos.zip" -d verify-macos
          test -f "verify-macos/README.txt"
          test -f "verify-macos/tts-preprocessor"
          ls -la verify-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact/${{ matrix.archive_name }}
